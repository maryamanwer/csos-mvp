services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: csos
      POSTGRES_USER: csos
      POSTGRES_PASSWORD: csos_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgresql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csos -d csos"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/csos_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p csos_password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j-init:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["/var/lib/neo4j/bin/cypher-shell"]
    command:
      - -a
      - neo4j://neo4j:7687
      - -u
      - neo4j
      - -p
      - csos_password
      - -f
      - /schema/schema.cypher
    volumes:
      - ./database/neo4j/schema.cypher:/schema/schema.cypher:ro
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp-gateway:
    build: ./mcp-gateway
    env_file: ./mcp-gateway/.env.example
    environment:
      MCP_BACKEND_URL: http://backend:8000/api/v1
      MCP_JWT_SECRET_KEY: change-me-in-production-32-bytes-minimum
      MCP_JWT_ISSUER: csos-auth
      MCP_JWT_AUDIENCE: csos-mcp
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
